<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Chronode: Beepbox JSON Visualizer.">
    <title>Chronode by Voxel</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <canvas id="visualizer" aria-hidden="true"></canvas>
    <audio id="audio" hidden></audio>

    <button id="help-btn">?</button>

    <div id="tutorial-overlay" class="hidden">
        <div id="tutorial-modal">
            <h2 id="tutorial-title"></h2>
            <div id="tutorial-body"></div>
            <div id="tutorial-footer">
                <button id="tut-prev">&lt; Prev</button>
                <span id="tut-page"></span>
                <button id="tut-next">Next &gt;</button>
            </div>
        </div>
    </div>

    <main id="ui-layer">
        
        <header id="top-bar">
            <div id="transport">
                <input type="file" id="file-picker" multiple accept=".json, .wav, .mp3" style="display: none;">
                <div id="drop-zone" role="button" tabindex="0" aria-label="Drop JSON and WAV files here">Drop .json & .wav or .mp3</div>
                <button id="play-pause" aria-label="Play or Pause" disabled>▶</button>
                <div id="scrubber-container">
                    <input type="range" id="scrubber" min="0" max="100" value="0" step="0.1" aria-label="Audio scrubber" disabled>
                </div>
            </div>
            <button id="menu-toggle" aria-label="Toggle Settings Menu">☰</button>
        </header>

        <aside id="sidebar" aria-hidden="true">
            <div id="sidebar-title">Chronode by Voxel</div>
            <div class="setting-group">
                <label for="set-textSize">Text Size <span id="val-textSize">16px</span></label>
                <input type="range" id="set-textSize" min="1" max="48" value="16">
            </div>
            <div class="setting-group">
                <label for="set-dotScale">Dot Scale <span id="val-dotScale">1.0x</span></label>
                <input type="range" id="set-dotScale" min="0.1" max="3" step="0.1" value="1.0">
            </div>
            <div class="setting-group">
                <label for="set-lineThickness">Line Thickness <span id="val-lineThickness">2px</span></label>
                <input type="range" id="set-lineThickness" min="0" max="10" step="0.5" value="2">
            </div>

            <div class="setting-group">
                <label for="set-decayRadius">Decay Radius <span id="val-decayRadius">120%</span></label>
                <input type="range" id="set-decayRadius" min="0" max="250" step="5" value="120">
            </div>
            <div class="setting-group checkbox-group">
                <input type="checkbox" id="set-useFixed">
                <label for="set-useFixed">Use Fixed Orbital Spacing</label>
            </div>
            <div class="setting-group">
                <label for="set-fixedSpace">Fixed Spacing <span id="val-fixedSpace">50px</span></label>
                <input type="range" id="set-fixedSpace" min="10" max="150" value="50">
            </div>
            <div class="setting-group">
                <label for="set-decay">Decay Time <span id="val-decay">0.3s</span></label>
                <input type="range" id="set-decay" min="0" max="2" step="0.05" value="0.3">
            </div>
            <div class="setting-group">
                <label for="set-shot">Line Shot Time <span id="val-shot">0.1s</span></label>
                <input type="range" id="set-shot" min="0" max="0.5" step="0.01" value="0.1">
            </div>
            <div class="setting-group">
                <label for="set-exportRes">Export Resolution</label>
                <select id="set-exportRes">
                    <option value="viewport">Viewport</option>
                    <option value="720" selected>720p HD</option>
                    <option value="1080">1080p FHD</option>
                    <option value="1440">1440p QHD</option>
                    <option value="2160">4K UHD</option>
                </select>
            </div>
            
            <div id="channel-atlas" aria-label="Channel Legend"></div>

            <button id="btn-demo">Load Demo Song</button>
            <button id="btn-reset">Reset to Defaults</button>
        </aside>

    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
